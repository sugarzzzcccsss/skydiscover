name: CI

on:
  push:
    branches: [validation/first-autocorrelation-20261027]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3dab5f03d872d64288fca6e4f4d497f7b2c611c6
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run black --check skydiscover/ tests/ benchmarks/
      - run: uv run isort --check skydiscover/ tests/ benchmarks/
      # Enforced against everything outside the baseline in pyproject.toml, so a
      # newly-typed module cannot regress and the baseline can only shrink.
      - run: uv run mypy skydiscover/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims in requires-python.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3dab5f03d872d64288fca6e4f4d497f7b2c611c6
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Smoke test — package imports cleanly
        run: uv run python -c "from skydiscover import Runner, run_discovery, discover_solution, __version__; print(f'skydiscover {__version__} OK')"
      - name: Run tests
        run: uv run pytest tests/ -v -m "not slow and not integration"

  docs:
    # The docs site had no CI at all: `types:check` existed in package.json and
    # nothing ran it, so a broken mdx or type error only showed up on deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3dab5f03d872d64288fca6e4f4d497f7b2c611c6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run types:check
        working-directory: docs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3dab5f03d872d64288fca6e4f4d497f7b2c611c6
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv build
